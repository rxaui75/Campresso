name: campresso
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.6.12
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.1
  pay: ^2.0.0
  tflite_flutter: ^0.12.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  firebase_storage: ^12.1.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  path: ^1.9.0
  image: ^4.2.0
  crop_your_image: ^1.0.0
  mobile_scanner: ^5.2.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  speech_to_text: ^7.3.0
  http: ^1.2.2





  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logocolor.png"


  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/ads/
    - assets/images/cafes/
    - assets/images/cafes/dunkin/
    - assets/images/cafes/window/
    - assets/images/cafes/selu/
    - assets/pay/apple_pay.json
    - assets/markers/
    - assets/ml/crowd_model.tflite
    - assets/ml/scaler.json
    - assets/pay/apple_pay.json
    - assets/pay/google_pay.json
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg


